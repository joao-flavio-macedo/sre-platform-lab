apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/joao-flavio-macedo/sre-platform-lab.git
    targetRevision: main
    path: helm/platform-api
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 5
